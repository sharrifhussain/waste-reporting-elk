input {
  file {
    path => "/logs/waste-app.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:timestamp} %{IP:client_ip} %{WORD:http_method} %{URIPATHPARAM:endpoint} %{INT:status_code} %{INT:response_time}"
    }
  }

  mutate {
    convert => {
      "status_code" => "integer"
      "response_time" => "integer"
    }
  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "waste-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
